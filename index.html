<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经典俄罗斯方块 · 极简版</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: #1a1e2c;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    .game-container {
      background: #0b0d15;
      padding: 20px 25px;
      border-radius: 18px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px #2e3445, 0 8px 0 #05070c;
    }
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 100px;
    }
    .next-piece {
      background: #0b0d15;
      border-radius: 12px;
      padding: 12px 8px;
      box-shadow: inset 0 0 0 1px #2e3445;
    }
    .next-piece p {
      margin: 0 0 10px 0;
      color: #a6b3d9;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      font-weight: 500;
    }
    canvas.next-canvas {
      display: block;
      margin: 0 auto;
      border-radius: 6px;
      box-shadow: inset 0 0 0 1px #2e3445;
    }
    .score-box {
      background: #0b0d15;
      border-radius: 12px;
      padding: 14px 12px;
      box-shadow: inset 0 0 0 1px #2e3445;
      text-align: center;
    }
    .score-box div:first-child {
      color: #a6b3d9;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .score-box div:last-child {
      color: #f0f4ff;
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 0 #1f2537;
    }
    button {
      background: #2e3445;
      border: none;
      border-radius: 40px;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 600;
      color: #dbe2f5;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 5px 0 #121724, 0 4px 10px rgba(0,0,0,0.5);
      width: 100%;
      border: 1px solid #3f475e;
    }
    button:hover {
      background: #3a4158;
      color: white;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #121724, 0 4px 10px rgba(0,0,0,0.5);
    }
    .hint {
      color: #6b7a9e;
      font-size: 0.7rem;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.5;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="game-container">
  <!-- 主游戏板 10x20 -->
  <canvas id="board" width="300" height="600"></canvas>

  <div class="info-panel">
    <div class="next-piece">
      <p>下一块</p>
      <canvas id="nextCanvas" class="next-canvas" width="90" height="90"></canvas>
    </div>
    <div class="score-box">
      <div>得分</div>
      <div id="scoreDisplay">0</div>
    </div>
    <button id="restartBtn">↻ 重开</button>
    <div class="hint">
      ← → 移动<br>
      ↑ 旋转<br>
      ↓ 软降<br>
      空格 硬降
    </div>
  </div>
</div>

<script>
  (function(){
    // ---------- 游戏配置 ----------
    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 30;          // 主画布格子像素
    const NEXT_SIZE = 24;           // 预览画布格子像素 (90/4 ≈ 22.5 -> 24 可容纳4x4方块)
    
    // 获取 canvas 元素
    const boardCanvas = document.getElementById('board');
    const ctx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');

    // ---------- 俄罗斯方块形状 ----------
    const SHAPES = [
      // I
      [[1,1,1,1]],
      // O
      [[1,1],
       [1,1]],
      // T
      [[0,1,0],
       [1,1,1]],
      // S
      [[0,1,1],
       [1,1,0]],
      // Z
      [[1,1,0],
       [0,1,1]],
      // J
      [[1,0,0],
       [1,1,1]],
      // L
      [[0,0,1],
       [1,1,1]]
    ];

    // 给每个形状固定一个颜色 (经典明亮色)
    const COLORS = [
      '#3cc7f2', // I 青
      '#f7e05e', // O 黄
      '#b484e0', // T 紫
      '#5fdb6f', // S 绿
      '#f05a5a', // Z 红
      '#4a9eff', // J 蓝
      '#f9a84c'  // L 橙
    ];

    // ---------- 状态变量 ----------
    let board = [];                 // 二维数组: 0 空, 1-7 代表颜色索引+1
    let currentPiece = null;       // { shape, colorIndex, x, y }
    let nextPiece = null;          // { shape, colorIndex }
    let score = 0;
    let gameOver = false;
    let gameInterval = null;
    const BASE_INTERVAL = 400;     // 毫秒

    // ---------- 工具函数 ----------
    // 创建空棋盘
    function createEmptyBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    // 随机生成一个方块 (返回 { shape, colorIndex })
    function createRandomPiece() {
      const type = Math.floor(Math.random() * SHAPES.length);
      const shape = SHAPES[type].map(row => [...row]); // 深拷贝
      return { shape, colorIndex: type };
    }

    // 初始化新游戏 (或重开)
    function initGame() {
      // 清除计时器
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }
      
      board = createEmptyBoard();
      score = 0;
      gameOver = false;
      updateScore();

      // 生成第一个 next 和 current
      nextPiece = createRandomPiece();
      spawnNewPiece();

      // 重新绘制
      drawAll();
      
      // 启动游戏循环
      startLoop();
    }

    // 从 next 拿一个变成 current, 并生成新的 next
    function spawnNewPiece() {
      if (!nextPiece) {
        nextPiece = createRandomPiece();
      }
      // 当前块 = nextPiece, 并设置初始坐标 (顶部中间)
      const shape = nextPiece.shape.map(row => [...row]);
      const colorIndex = nextPiece.colorIndex;
      
      currentPiece = {
        shape: shape,
        colorIndex: colorIndex,
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0
      };
      
      // 生成下一个方块
      nextPiece = createRandomPiece();

      // 如果生成时立即碰撞 => game over
      if (collision(currentPiece.shape, currentPiece.x, currentPiece.y)) {
        gameOver = true;
        if (gameInterval) {
          clearInterval(gameInterval);
          gameInterval = null;
        }
      }
    }

    // 碰撞检测 (shape, offsetX, offsetY)
    function collision(shape, offsetX, offsetY) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
          if (shape[r][c] !== 0) {
            const boardX = offsetX + c;
            const boardY = offsetY + r;
            // 超出边界 或 已被占用
            if (boardX < 0 || boardX >= COLS || boardY >= ROWS || boardY < 0) {
              return true;
            }
            if (boardY >= 0 && board[boardY][boardX] !== 0) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // 将 currentPiece 固定到 board 上
    function lockPiece() {
      if (!currentPiece) return;
      
      const { shape, colorIndex, x, y } = currentPiece;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
          if (shape[r][c] !== 0) {
            const boardX = x + c;
            const boardY = y + r;
            if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
              board[boardY][boardX] = colorIndex + 1; // 存储 1-7
            }
          }
        }
      }

      // 消除满行并更新分数
      clearFullRows();

      // 生成下一个方块
      spawnNewPiece();

      // 如果游戏结束，停止循环
      if (gameOver) {
        if (gameInterval) {
          clearInterval(gameInterval);
          gameInterval = null;
        }
      }
    }

    // 消除满行 (经典计分: 1行100, 2行300, 3行500, 4行800)
    function clearFullRows() {
      let rowsCleared = 0;
      for (let row = ROWS - 1; row >= 0; ) {
        // 检查该行是否全满
        const full = board[row].every(cell => cell !== 0);
        if (full) {
          // 移除该行，上方整体下移
          for (let r = row; r > 0; r--) {
            board[r] = [...board[r-1]];
          }
          // 最顶行置空
          board[0] = Array(COLS).fill(0);
          rowsCleared++;
          // 继续检查同一行（因为上面下移了）
        } else {
          row--;
        }
      }

      if (rowsCleared > 0) {
        // 经典计分规则
        const points = [0, 100, 300, 500, 800];
        const addScore = points[rowsCleared] || 800;
        score += addScore;
        updateScore();
      }
    }

    // 更新得分显示
    function updateScore() {
      scoreDisplay.textContent = score;
    }

    // ---------- 移动/旋转操作 ----------
    function movePiece(dx, dy) {
      if (!currentPiece || gameOver) return false;
      
      const { shape, x, y } = currentPiece;
      const newX = x + dx;
      const newY = y + dy;
      
      if (!collision(shape, newX, newY)) {
        currentPiece.x = newX;
        currentPiece.y = newY;
        drawAll();
        return true;
      }
      
      // 如果是向下移动失败 (dy > 0)  => 固定
      if (dy > 0) {
        lockPiece();
        drawAll();
        // 若游戏结束，停止循环
        if (gameOver && gameInterval) {
          clearInterval(gameInterval);
          gameInterval = null;
        }
      }
      return false;
    }

    // 旋转 (顺时针)
    function rotatePiece() {
      if (!currentPiece || gameOver) return;
      
      const oldShape = currentPiece.shape;
      // 矩阵顺时针旋转90度
      const rotated = oldShape[0].map((_, idx) => 
        oldShape.map(row => row[idx]).reverse()
      );
      
      const { x, y } = currentPiece;
      
      // 踢墙简易处理：尝试左右偏移一次
      if (!collision(rotated, x, y)) {
        currentPiece.shape = rotated;
      } else {
        // 左移一格尝试
        if (!collision(rotated, x - 1, y)) {
          currentPiece.shape = rotated;
          currentPiece.x -= 1;
        }
        // 右移一格尝试
        else if (!collision(rotated, x + 1, y)) {
          currentPiece.shape = rotated;
          currentPiece.x += 1;
        }
        // 还可以尝试上移，但简单起见暂不处理
      }
      drawAll();
    }

    // 硬降
    function hardDrop() {
      if (!currentPiece || gameOver) return;
      
      // 一直向下移动直到碰撞
      while (!collision(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
      }
      // 固定到 board
      lockPiece();
      drawAll();

      if (gameOver && gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }
    }

    // ---------- 绘制 ----------
    function drawAll() {
      drawBoard();
      drawNext();
    }

    // 绘制主棋盘
    function drawBoard() {
      ctx.clearRect(0, 0, 300, 600);
      
      // 绘制网格线 (暗线，极简风格用淡淡的线)
      ctx.strokeStyle = '#1e2433';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * BLOCK_SIZE, 0);
        ctx.lineTo(i * BLOCK_SIZE, 600);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * BLOCK_SIZE);
        ctx.lineTo(300, i * BLOCK_SIZE);
        ctx.stroke();
      }

      // 绘制已固定的方块
      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const val = board[row][col];
          if (val !== 0) {
            ctx.fillStyle = COLORS[val - 1];
            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
            // 加一点内发光效果
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE-2, 2);
          }
        }
      }

      // 绘制当前方块 (如果有并且游戏未结束)
      if (currentPiece && !gameOver) {
        const { shape, colorIndex, x, y } = currentPiece;
        for (let r = 0; r < shape.length; r++) {
          for (let c = 0; c < shape[0].length; c++) {
            if (shape[r][c] !== 0) {
              const boardX = (x + c) * BLOCK_SIZE;
              const boardY = (y + r) * BLOCK_SIZE;
              if (boardY >= 0) {
                ctx.fillStyle = COLORS[colorIndex];
                ctx.fillRect(boardX, boardY, BLOCK_SIZE-1, BLOCK_SIZE-1);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fillRect(boardX, boardY, BLOCK_SIZE-2, 2);
              }
            }
          }
        }
      }

      // 游戏结束蒙层
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, 300, 600);
        ctx.fillStyle = '#f0f4ff';
        ctx.font = 'bold 24px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GAME OVER', 150, 300);
      }
    }

    // 绘制预览方块
    function drawNext() {
      nextCtx.clearRect(0, 0, 90, 90);
      
      if (!nextPiece) return;
      
      const shape = nextPiece.shape;
      const colorIndex = nextPiece.colorIndex;
      const cols = shape[0].length;
      const rows = shape.length;
      
      // 计算偏移使其居中 (4x4 网格)
      const offsetX = (4 - cols) * NEXT_SIZE / 2;
      const offsetY = (4 - rows) * NEXT_SIZE / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (shape[r][c] !== 0) {
            const x = offsetX + c * NEXT_SIZE;
            const y = offsetY + r * NEXT_SIZE;
            nextCtx.fillStyle = COLORS[colorIndex];
            nextCtx.fillRect(x, y, NEXT_SIZE-2, NEXT_SIZE-2);
            nextCtx.fillStyle = 'rgba(255,255,255,0.2)';
            nextCtx.fillRect(x, y, NEXT_SIZE-4, 2);
          }
        }
      }
    }

    // ---------- 游戏循环 ----------
    function startLoop() {
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (!gameOver && currentPiece) {
          movePiece(0, 1);  // 自动下落
        }
      }, BASE_INTERVAL);
    }

    // ---------- 键盘控制 ----------
    function handleKeyDown(e) {
      const key = e.key;
      // 阻止箭头键滚动/空格翻页
      const preventKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'];
      if (preventKeys.includes(key) || key === ' ') {
        e.preventDefault();
      }

      if (gameOver) return;

      switch (key) {
        case 'ArrowLeft':  movePiece(-1, 0); break;
        case 'ArrowRight': movePiece(1, 0); break;
        case 'ArrowDown':  movePiece(0, 1); break;
        case 'ArrowUp':    rotatePiece(); break;
        case ' ':
        case 'Space':      hardDrop(); break;
      }
      // 额外：更新画布 (movePiece 内部已调用 drawAll, 但为了保险)
      drawAll();
    }

    // ---------- 重新开始 ----------
    function restartGame() {
      initGame();
    }

    // ---------- 事件绑定 ----------
    window.addEventListener('keydown', handleKeyDown);
    
    document.getElementById('restartBtn').addEventListener('click', () => {
      restartGame();
    });

    // 确保画布点击时不聚焦导致键盘无响应 (body聚焦)
    // 把焦点保持在body上即可，无特殊处理

    // ---------- 启动游戏 ----------
    initGame();

  })();
</script>
</body>
</html>
